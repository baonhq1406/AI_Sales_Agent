# Nginx Reverse Proxy Configuration for AI Sales Agent & Customer 360
# Path on VPS: /etc/nginx/sites-available/sales-agent.conf
# Enable: sudo ln -s /etc/nginx/sites-available/sales-agent.conf /etc/nginx/sites-enabled/

# 1. Upstream Definitions
upstream nextjs_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream nestjs_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream n8n_server {
    server 127.0.0.1:5678;
    keepalive 32;
}

# 2. Main Web & API Server Block
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Thay thế bằng domain hoặc IP của VPS

    # Maximum upload size for voice cloning audio samples
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # NestJS Core API Gateway
    location /api/v1/ {
        proxy_pass http://nestjs_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Next.js Web App & Dashboard
    location / {
        proxy_pass http://nextjs_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# 3. Optional: Dedicated Subdomain for n8n Workflow Orchestration
server {
    listen 80;
    listen [::]:80;
    server_name n8n.your-domain.com; # Thay thế bằng subdomain cho n8n

    client_max_body_size 50M;

    location / {
        proxy_pass http://n8n_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
