<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="ambientOrb" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#ambientOrb)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Core AI Sales Lightning Bolt Glyph with Glow -->
  <g filter="url(#glow)">
    <path d="M284 84 L148 276 L252 276 L224 432 L368 236 L264 236 Z" 
          fill="url(#boltGrad)" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- Futuristic Micro Node Dots -->
  <circle cx="160" cy="150" r="10" fill="#38bdf8" opacity="0.8"/>
  <circle cx="360" cy="370" r="12" fill="#c084fc" opacity="0.8"/>

  <!-- Live Pulse Dot in Top Right -->
  <circle cx="410" cy="102" r="28" fill="#10b981" opacity="0.25"/>
  <circle cx="410" cy="102" r="18" fill="#10b981" opacity="0.6"/>
  <circle cx="410" cy="102" r="12" fill="#34d399" stroke="#ffffff" stroke-width="3"/>
</svg>
