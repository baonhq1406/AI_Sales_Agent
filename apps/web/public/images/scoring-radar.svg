<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgScore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="scoreRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadowS" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="24" fill="url(#bgScore)"/>
  <rect x="1" y="1" width="598" height="358" rx="23" stroke="#581c87" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Radial Gauge Graphic -->
  <g transform="translate(170, 180)">
    <!-- Outer Track -->
    <circle cx="0" cy="0" r="100" stroke="#334155" stroke-width="18" fill="none"/>
    <!-- Progress Arc (~95%) -->
    <circle cx="0" cy="0" r="100" stroke="url(#scoreRing)" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="596" stroke-dashoffset="60" fill="none" transform="rotate(-90)"/>
    
    <!-- Center Score Text -->
    <text x="0" y="5" fill="#ffffff" font-size="44" font-weight="900" text-anchor="middle" font-family="sans-serif">95</text>
    <text x="0" y="32" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">/ 100 ĐIỂM</text>
    <text x="0" y="-45" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">LEAD SCORE</text>
  </g>

  <!-- Classification Card Right -->
  <g transform="translate(330, 45)" filter="url(#shadowS)">
    <rect width="230" height="120" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="16" y="16" width="100" height="24" rx="12" fill="#b91c1c"/>
    <text x="66" y="32" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">🔥 HOT LEAD</text>
    
    <text x="16" y="65" fill="#f8fafc" font-size="14" font-weight="extrabold" font-family="sans-serif">Doanh Nghiệp Vận Tải</text>
    <text x="16" y="85" fill="#94a3b8" font-size="12" font-family="sans-serif">Quy mô: 50+ Phương tiện</text>
    <text x="16" y="105" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif">Ý định: Chốt Hợp Đồng Gấp</text>
  </g>

  <!-- Churn Risk & Health Card Right -->
  <g transform="translate(330, 185)" filter="url(#shadowS)">
    <rect width="230" height="130" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="16" y="32" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">CUSTOMER 360 HEALTH</text>
    
    <!-- Health Bar -->
    <rect x="16" y="44" width="198" height="10" rx="5" fill="#334155"/>
    <rect x="16" y="44" width="180" height="10" rx="5" fill="#10b981"/>
    
    <text x="16" y="78" fill="#f8fafc" font-size="13" font-weight="bold" font-family="sans-serif">Độ hài lòng: 92% (Rất cao)</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="12" font-family="sans-serif">Rủi ro rời bỏ: 5% (Rất thấp)</text>
    <text x="16" y="118" fill="#c084fc" font-size="11" font-weight="bold" font-family="sans-serif">Hành động: Tự động gửi Demo</text>
  </g>
</svg>
