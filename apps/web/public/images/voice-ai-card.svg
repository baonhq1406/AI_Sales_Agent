<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgVoice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowV" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="360" rx="24" fill="url(#bgVoice)"/>
  <rect x="1" y="1" width="598" height="358" rx="23" stroke="#4338ca" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Glowing Soundwave Equalizer Visualization -->
  <g transform="translate(180, 160)">
    <rect x="-140" y="-80" width="280" height="160" rx="20" fill="url(#glowG)"/>
    <!-- Dancing Bars -->
    <rect x="-110" y="-15" width="8" height="30" rx="4" fill="#38bdf8"/>
    <rect x="-90" y="-35" width="8" height="70" rx="4" fill="#38bdf8"/>
    <rect x="-70" y="-50" width="8" height="100" rx="4" fill="#60a5fa"/>
    <rect x="-50" y="-25" width="8" height="50" rx="4" fill="#818cf8"/>
    <rect x="-30" y="-60" width="8" height="120" rx="4" fill="#818cf8"/>
    <rect x="-10" y="-40" width="8" height="80" rx="4" fill="#a855f7"/>
    <rect x="10" y="-70" width="8" height="140" rx="4" fill="#c084fc"/>
    <rect x="30" y="-45" width="8" height="90" rx="4" fill="#c084fc"/>
    <rect x="50" y="-20" width="8" height="40" rx="4" fill="#e879f9"/>
    <rect x="70" y="-55" width="8" height="110" rx="4" fill="#ec4899"/>
    <rect x="90" y="-30" width="8" height="60" rx="4" fill="#ec4899"/>
    <rect x="110" y="-10" width="8" height="20" rx="4" fill="#f43f5e"/>
  </g>

  <!-- Floating Call Badge -->
  <g transform="translate(40, 40)" filter="url(#shadowV)">
    <rect width="180" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="10" fill="#10b981"/>
    <text x="42" y="27" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Voice AI Active</text>
    <text x="142" y="27" fill="#94a3b8" font-size="11" font-family="monospace">00:42</text>
  </g>

  <!-- Speech Transcript Bubble Left -->
  <g transform="translate(360, 60)" filter="url(#shadowV)">
    <rect width="200" height="90" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="14" y="14" width="60" height="20" rx="6" fill="#312e81"/>
    <text x="22" y="28" fill="#818cf8" font-size="10" font-weight="bold" font-family="sans-serif">Trợ lý AI</text>
    <text x="14" y="52" fill="#f1f5f9" font-size="12" font-weight="600" font-family="sans-serif">"Dạ em chào anh Nam,</text>
    <text x="14" y="70" fill="#94a3b8" font-size="11" font-family="sans-serif">bên em hỗ trợ báo giá ngay..."</text>
  </g>

  <!-- Speech Transcript Bubble Right -->
  <g transform="translate(360, 180)" filter="url(#shadowV)">
    <rect width="200" height="90" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="14" y="14" width="75" height="20" rx="6" fill="#065f46"/>
    <text x="22" y="28" fill="#34d399" font-size="10" font-weight="bold" font-family="sans-serif">Khách hàng</text>
    <text x="14" y="52" fill="#f1f5f9" font-size="12" font-weight="600" font-family="sans-serif">"Gửi sớm cho anh nhé,</text>
    <text x="14" y="70" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">Đang cần gấp hôm nay!"</text>
  </g>

  <!-- Tech tags at bottom -->
  <g transform="translate(40, 290)">
    <rect width="130" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="65" y="20" fill="#a5b4fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">🎙️ Whisper v3</text>
  </g>
  <g transform="translate(180, 290)">
    <rect width="150" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="75" y="20" fill="#a5b4fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">⚡ Llama 3.3 70B</text>
  </g>
</svg>
