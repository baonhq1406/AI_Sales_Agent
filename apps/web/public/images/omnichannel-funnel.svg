<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgFunnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadowF" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="24" fill="url(#bgFunnel)"/>
  <rect x="1" y="1" width="598" height="358" rx="23" stroke="#047857" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Left: 3 Input Channels -->
  <g transform="translate(40, 45)" filter="url(#shadowF)">
    <rect width="160" height="65" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#38bdf8" font-size="20">🌐</text>
    <text x="54" y="30" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Web Form</text>
    <text x="54" y="48" fill="#94a3b8" font-size="11" font-family="sans-serif">WF-07 Ingest</text>
  </g>

  <g transform="translate(40, 135)" filter="url(#shadowF)">
    <rect width="160" height="65" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#a855f7" font-size="20">✉️</text>
    <text x="54" y="30" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Email / Inbound</text>
    <text x="54" y="48" fill="#94a3b8" font-size="11" font-family="sans-serif">SMTP Webhook</text>
  </g>

  <g transform="translate(40, 225)" filter="url(#shadowF)">
    <rect width="160" height="65" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#34d399" font-size="20">📞</text>
    <text x="54" y="30" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">VoIP Phone</text>
    <text x="54" y="48" fill="#94a3b8" font-size="11" font-family="sans-serif">Twilio SIP</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M210 77 L280 150" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M210 167 L280 167" stroke="#a855f7" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M210 257 L280 185" stroke="#34d399" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Center Funnel / Deduplication Hub -->
  <g transform="translate(280, 105)" filter="url(#shadowF)">
    <rect width="120" height="120" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="60" cy="45" r="22" fill="#065f46"/>
    <text x="60" y="52" fill="#34d399" font-size="20" text-anchor="middle">🛡️</text>
    <text x="60" y="86" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Khử Trùng Lặp</text>
    <text x="60" y="102" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Deduplication</text>
  </g>

  <!-- Output Arrow to Database -->
  <path d="M410 167 L460 167" stroke="#10b981" stroke-width="4"/>
  <polygon points="460,161 472,167 460,173" fill="#10b981"/>

  <!-- Right: PostgreSQL pgvector Storage Card -->
  <g transform="translate(470, 85)" filter="url(#shadowF)">
    <rect width="100" height="160" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="35" fill="#38bdf8" font-size="24" text-anchor="middle">🐘</text>
    <text x="50" y="65" fill="#ffffff" font-size="11" font-weight="extrabold" text-anchor="middle" font-family="sans-serif">Postgres</text>
    <text x="50" y="80" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">pgvector 17</text>
    <rect x="15" y="100" width="70" height="20" rx="6" fill="#065f46"/>
    <text x="50" y="114" fill="#34d399" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">ĐÃ LƯU TRỮ</text>
    <text x="50" y="138" fill="#cbd5e1" font-size="10" font-family="monospace" text-anchor="middle">1.2ms SLA</text>
  </g>
</svg>
