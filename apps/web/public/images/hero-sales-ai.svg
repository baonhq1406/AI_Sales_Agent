<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="24" fill="url(#bgGrad)"/>

  <!-- Neural Connection Mesh -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <line x1="220" y1="180" x2="400" y2="140"/>
    <line x1="400" y1="140" x2="580" y2="190"/>
    <line x1="220" y1="180" x2="260" y2="340"/>
    <line x1="400" y1="140" x2="400" y2="300"/>
    <line x1="580" y1="190" x2="540" y2="340"/>
    <line x1="260" y1="340" x2="400" y2="300"/>
    <line x1="400" y1="300" x2="540" y2="340"/>
  </g>

  <!-- Central Agent Core Hub -->
  <g transform="translate(400, 140)">
    <circle r="46" fill="#ffffff" filter="url(#softShadow)"/>
    <circle r="36" fill="url(#indigoGrad)"/>
    <!-- Bot Icon -->
    <path d="M-12 -6 A12 12 0 0 1 12 -6 L12 6 A12 12 0 0 1 -12 6 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="-5" cy="-2" r="2.5" fill="#4f46e5"/>
    <circle cx="5" cy="-2" r="2.5" fill="#4f46e5"/>
    <path d="M-4 3 Q0 6 4 3" stroke="#4f46e5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Glow ring -->
    <circle r="46" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Left Card: Customer 360 & Scoring -->
  <g transform="translate(110, 160)" filter="url(#softShadow)">
    <rect width="180" height="130" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Header -->
    <circle cx="30" cy="30" r="14" fill="#eff6ff"/>
    <path d="M25 34 C25 30 27 28 30 28 C33 28 35 30 35 34 Z M27 24 A3 3 0 1 1 33 24 A3 3 0 1 1 27 24 Z" fill="#3b82f6"/>
    <text x="52" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Customer 360</text>
    <text x="52" y="39" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">An Phát Logistics</text>
    <!-- Score Badge -->
    <rect x="20" y="55" width="140" height="28" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="32" y="73" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#15803d">AI Score: 92/100</text>
    <circle cx="144" cy="69" r="4" fill="#22c55e"/>
    <!-- Progress Mini-bar -->
    <rect x="20" y="96" width="140" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="20" y="96" width="128" height="6" rx="3" fill="url(#emeraldGrad)"/>
    <text x="20" y="116" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">Hot Lead • Đề xuất: Demo</text>
  </g>

  <!-- Right Card: Voice AI Calling -->
  <g transform="translate(510, 160)" filter="url(#softShadow)">
    <rect width="180" height="130" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Header -->
    <circle cx="30" cy="30" r="14" fill="#faf5ff"/>
    <path d="M26 25 L34 25 C34 31 30 35 26 35 Z" fill="#8b5cf6"/>
    <text x="52" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Voice AI Studio</text>
    <text x="52" y="39" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">WF-01 Outbound Live</text>
    <!-- Sound Waves Animation Simulation -->
    <g transform="translate(30, 60)" fill="#7c3aed">
      <rect x="0" y="8" width="4" height="14" rx="2"/>
      <rect x="8" y="2" width="4" height="24" rx="2"/>
      <rect x="16" y="0" width="4" height="28" rx="2"/>
      <rect x="24" y="5" width="4" height="18" rx="2"/>
      <rect x="32" y="9" width="4" height="12" rx="2"/>
      <rect x="40" y="3" width="4" height="22" rx="2"/>
      <rect x="48" y="7" width="4" height="15" rx="2"/>
      <rect x="56" y="1" width="4" height="26" rx="2"/>
      <rect x="64" y="6" width="4" height="18" rx="2"/>
      <rect x="72" y="10" width="4" height="10" rx="2"/>
      <rect x="80" y="4" width="4" height="20" rx="2"/>
      <rect x="88" y="9" width="4" height="12" rx="2"/>
      <rect x="96" y="1" width="4" height="26" rx="2"/>
      <rect x="104" y="7" width="4" height="15" rx="2"/>
      <rect x="112" y="10" width="4" height="10" rx="2"/>
    </g>
    <rect x="20" y="98" width="140" height="22" rx="6" fill="#f5f3ff"/>
    <text x="32" y="113" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#6d28d9">TTS: Hoài My (Neural HD)</text>
  </g>

  <!-- Bottom Card: Human-in-the-Loop Approval -->
  <g transform="translate(290, 290)" filter="url(#softShadow)">
    <rect width="220" height="140" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Header -->
    <circle cx="32" cy="32" r="14" fill="#ecfdf5"/>
    <path d="M28 32 L31 35 L37 28" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">HITL Quotation Approval</text>
    <text x="54" y="41" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Kiểm duyệt Báo giá Ngoại lệ</text>
    
    <rect x="20" y="58" width="180" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="30" y="73" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#334155">Chiết khấu: 18% (Vượt trần 10%)</text>
    <text x="30" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">AI Khuyến nghị: Chấp thuận (Biên 62%)</text>

    <!-- Buttons -->
    <rect x="20" y="102" width="85" height="26" rx="6" fill="url(#emeraldGrad)"/>
    <text x="43" y="118" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">Duyệt Đơn</text>

    <rect x="115" y="102" width="85" height="26" rx="6" fill="#f1f5f9"/>
    <text x="141" y="118" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#475569">Từ chối</text>
  </g>

  <!-- Floating Metric Pills -->
  <g transform="translate(140, 70)" filter="url(#softShadow)">
    <rect width="130" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="18" cy="17" r="7" fill="#22c55e"/>
    <text x="32" y="21" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Multi-Agent LIVE</text>
  </g>

  <g transform="translate(540, 70)" filter="url(#softShadow)">
    <rect width="145" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="18" cy="17" r="7" fill="#6366f1"/>
    <text x="32" y="21" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Gemini 3.8 Flash</text>
  </g>
</svg>
